{# Shared client profile fields; `client` may be undefined for the create form. #}
{% set c = client or {} %}
<div class="grid">
  <label>Name <input name="name" value="{{ c.name or '' }}" maxlength="80" required></label>
  <label>Age <input name="age" type="number" min="1" max="120" value="{{ c.age or '' }}"></label>
  <label>Height (cm) <input name="height" type="number" step="0.1" min="50" max="272" value="{{ c.height or '' }}"></label>
  <label>Weight (kg) <input name="weight" type="number" step="0.1" min="1" max="500" value="{{ c.weight or '' }}"></label>
  <label>Program
    <select name="program">
      <option value="">-- none --</option>
      {% for code, program in programs.items() %}
        <option value="{{ code }}" {% if c.program == code %}selected{% endif %}>{{ program.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Target weight (kg) <input name="target_weight" type="number" step="0.1" min="1" max="500" value="{{ c.target_weight or '' }}"></label>
  <label>Target adherence (%) <input name="target_adherence" type="number" min="0" max="100" value="{{ c.target_adherence if c.target_adherence is not none else '' }}"></label>
  <label>Membership
    <select name="membership_status">
      {% for status in ['Active', 'Inactive'] %}
        <option {% if (c.membership_status or 'Active') == status %}selected{% endif %}>{{ status }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Membership end <input name="membership_end" type="date" value="{{ c.membership_end or '' }}"></label>
</div>
