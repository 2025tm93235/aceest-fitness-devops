# SonarQube analysis settings (used by the optional Jenkins "SonarQube Analysis" stage)
sonar.projectKey=aceest-fitness-devops
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

sonar.sources=app.py,aceest
sonar.tests=tests
sonar.exclusions=legacy/**
sonar.python.version=3.13

# Reports produced by the "Unit Tests" stage (copied out of the test container)
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
