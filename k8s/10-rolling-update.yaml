# ROLLING UPDATE: pods are replaced one at a time (maxSurge 1, maxUnavailable 0).
# Rollback: kubectl rollout undo deployment/aceest-rolling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    track: rolling
  annotations:
    kubernetes.io/change-cause: "initial deployment"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # never drop below the desired replica count -> zero downtime
  selector:
    matchLabels:
      app.kubernetes.io/name: aceest-fitness
      track: rolling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-fitness
        app.kubernetes.io/part-of: aceest
        track: rolling
    spec:
      initContainers:
        # The shared SQLite volume is created root-owned; hand it to the app user.
        - name: prepare-data
          image: busybox:1.36
          command: ["sh", "-c", "chown 10001:10001 /data && chmod 0775 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: app
          image: docker.io/2025tm93235/aceest-fitness:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: ACEEST_DB_PATH
              value: /data/aceest.db
            - name: DEPLOYMENT_TRACK
              value: rolling
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ACEEST_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aceest-secrets
                  key: secret-key
            - name: ACEEST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aceest-secrets
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aceest-data
---
# Service for the rolling-update deployment.
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aceest-fitness
    track: rolling
  ports:
    - name: http
      port: 80
      targetPort: http
